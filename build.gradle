plugins {
    id "java"
    id "maven-publish"
}

group = "com.github.echolightmc"
version = "1.9-SNAPSHOT"

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "net.minestom:minestom:2026.07.22-26.2"
    testImplementation "net.minestom:testing:2026.07.22-26.2"
    testImplementation "net.kyori:adventure-text-minimessage:5.2.0"
}

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = group
            artifactId = rootProject.name
            version = this.version
            from components.java

            pom {
                name = artifactId
                description = "Custom NameTag system using text displays for Minestom"
            }
        }
    }
    repositories {
        maven {
            url = "https://maven.hapily.me/releases"

            def repoUsername = findProperty("repoHapilyUsername")
            def repoPassword = findProperty("repoHapilyPassword")

            if (repoUsername != null && repoPassword != null) {
                credentials {
                    username = repoUsername
                    password = repoPassword
                }
            }
        }
    }
}